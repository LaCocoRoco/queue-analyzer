# Packages addon/QueueAnalyzer and uploads it to CurseForge automatically --
# only on a pushed tag (e.g. `git tag v0.3.0 && git push --tags`), never on
# regular commits, so day-to-day pushes don't spam CurseForge with releases.
#
# Uses BigWigsMods/packager's release.sh (the standard WoW addon release
# tool -- used by most CurseForge addons) directly via `run:`. It has a hard
# design assumption (confirmed live, two different failures): $topdir must
# be BOTH the addon's own folder (it looks for *.toc directly inside it) AND
# a real git checkout root (`-d "$topdir/.git"`, a literal directory check,
# not just "somewhere inside a repo"). In this monorepo those are two
# different places -- addon/QueueAnalyzer has no .git of its own, and the
# actual repo root has no .toc. There's no flag to decouple the two.
#
# The fix: copy just the addon folder into its own fresh, throwaway git
# repo (a real `git init` + commit, so both of release.sh's checks pass
# against that one self-contained directory), and run release.sh there
# instead of against the real checkout. The synthetic one-commit history is
# fine -- we don't rely on this tool's git-log-based changelog, and the
# addon's own version comes from QueueAnalyzer.toc's ## Version line either
# way. The throwaway repo's HEAD also needs the SAME tag that triggered this
# workflow (github.ref_name) recreated on it -- release.sh classifies the
# CurseForge upload type (alpha/beta/release) by checking whether HEAD has a
# matching tag at all (confirmed live: an untagged commit silently uploads
# as "alpha", regardless of what the real repo's tag was named).
#
# Reads the CurseForge project ID from the addon's own QueueAnalyzer.toc
# ("## X-Curse-Project-ID: 1692771"). Authenticates via the CF_API_TOKEN
# environment variable release.sh itself reads -- mapped here from the
# CF_API_KEY repo secret (that's just the secret's NAME; the value is the
# same CurseForge API token either way).
name: Release Addon to CurseForge

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare standalone addon checkout
        run: |
          mkdir -p /tmp/qa-release/QueueAnalyzer
          cp -r addon/QueueAnalyzer/. /tmp/qa-release/QueueAnalyzer/
          cd /tmp/qa-release/QueueAnalyzer
          git init -q
          git add -A
          git -c user.email=ci@localhost -c user.name=ci commit -q -m "release"
          git tag "${{ github.ref_name }}"

      - name: Checkout packager
        uses: actions/checkout@v4
        with:
          repository: BigWigsMods/packager
          path: .packager

      - name: Package and release
        working-directory: /tmp/qa-release/QueueAnalyzer
        run: bash "$GITHUB_WORKSPACE/.packager/release.sh"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
