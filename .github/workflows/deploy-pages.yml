name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "webapp/**"
      - ".github/workflows/deploy-pages.yml"
  # Retries the addon-release gate below on its own, with no new push needed
  # -- CurseForge approval happens on CurseForge's own schedule, not ours, so
  # a push that lands while a newer addon major is still pending review would
  # otherwise stay blocked forever until someone happens to push again.
  # Hourly is plenty for a personal project (approval takes hours/days, not
  # minutes) and this job is cheap (no build, just one API call) either way.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

# Only one deployment at a time; a push while one is running cancels the
# older run in favor of the newer one instead of queueing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Blocks the webapp deploy until CurseForge is actually serving an addon
  # build whose MAJOR version matches (or exceeds) what this webapp commit
  # requires (see webapp/lib/lookup.ts's EXPECTED_ADDON_VERSION and Core.lua's
  # ADDON_VERSION/MajorVersion -- only the major component has to match,
  # minor/patch are backwards compatible). Without this, a webapp push that
  # bumps the required major could go live BEFORE the matching addon build
  # clears CurseForge review, breaking the addon for everyone still on the
  # old (still-approved) version in the meantime.
  #
  # CurseForge's public "CurseForge for Studios" API (api.curseforge.com,
  # NOT the legacy wow.curseforge.com upload API CF_API_KEY is for -- see
  # CURSEFORGE_READ_API_KEY, a separate secret) is confirmed live to report
  # mainFileId: 0 / latestFiles: [] for a project with no approved file yet,
  # and a populated latestFiles[0].displayName (e.g. "v1.0.0") once a file
  # has actually cleared review -- that's the exact signal checked here, no
  # manual polling needed.
  #
  # On a SCHEDULED run specifically, this also checks whether the current
  # commit is already what's live on Pages, and skips if so -- without this,
  # once the version gate is satisfied it would stay satisfied on every
  # future hourly run too (addon majors only go up), rebuilding and
  # redeploying the exact same unchanged site every single hour forever.
  # Not needed for push/workflow_dispatch runs -- those only fire because
  # there's an actual new commit to deploy in the first place.
  check-addon-release:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_READ_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          REQUIRED_MAJOR=$(sed -n 's/.*EXPECTED_ADDON_VERSION = "\([0-9]*\)\..*/\1/p' webapp/lib/lookup.ts)
          if [ -z "$REQUIRED_MAJOR" ]; then
            echo "::error::Could not extract EXPECTED_ADDON_VERSION's major from webapp/lib/lookup.ts"
            exit 1
          fi

          # `|| true` on the curl and a jq fallback below are deliberate: a
          # CurseForge outage or transient network error should degrade to
          # "not confirmed ready, skip this run" (retried automatically next
          # hour) rather than a hard-failed, red-X workflow run every time
          # CurseForge hiccups.
          RESPONSE=$(curl -s -H "x-api-key: $CURSEFORGE_API_KEY" "https://api.curseforge.com/v1/mods/1692771" || true)
          LIVE_DISPLAY_NAME=$(printf '%s' "$RESPONSE" | jq -r '.data.latestFiles[0].displayName // "v0.0.0"' 2>/dev/null)
          if [ -z "$LIVE_DISPLAY_NAME" ]; then
            LIVE_DISPLAY_NAME="v0.0.0"
          fi
          LIVE_MAJOR=$(echo "$LIVE_DISPLAY_NAME" | sed -E 's/^[vV]?([0-9]+).*/\1/')

          echo "Webapp requires addon major: $REQUIRED_MAJOR"
          echo "CurseForge currently serves: $LIVE_DISPLAY_NAME (major $LIVE_MAJOR)"

          VERSION_OK=false
          if [ "$LIVE_MAJOR" -ge "$REQUIRED_MAJOR" ] 2>/dev/null; then
            VERSION_OK=true
          fi

          ALREADY_LIVE=false
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            DEPLOYED_SHA=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=1" --jq '.[0].sha // empty' 2>/dev/null || echo "")
            echo "Currently live commit: ${DEPLOYED_SHA:-none}; this run's commit: $GITHUB_SHA"
            if [ -n "$DEPLOYED_SHA" ] && [ "$DEPLOYED_SHA" = "$GITHUB_SHA" ]; then
              ALREADY_LIVE=true
            fi
          fi

          if [ "$VERSION_OK" = "true" ] && [ "$ALREADY_LIVE" = "false" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$ALREADY_LIVE" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Already deployed at this commit -- nothing new to do (expected, not an error)."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Addon major $REQUIRED_MAJOR not confirmed live on CurseForge (currently: $LIVE_DISPLAY_NAME) -- skipping this deploy. Will retry automatically on the next hourly run, or on the next push."
          fi

  build:
    needs: check-addon-release
    if: needs.check-addon-release.outputs.ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - run: npm ci

      # NEXT_PUBLIC_* are inlined into the browser bundle at build time --
      # not secrets, just the public WCL season config (see .env.example).
      # Configure these once under Settings -> Secrets and variables ->
      # Actions -> Variables (repository variables, not secrets).
      - run: npm run build
        env:
          NEXT_PUBLIC_WCL_REGION: ${{ vars.WCL_REGION }}
          NEXT_PUBLIC_WCL_ZONE_ID: ${{ vars.WCL_ZONE_ID }}
          NEXT_PUBLIC_WCL_PARTITION: ${{ vars.WCL_PARTITION }}
          # Project page (github.com/<user>/queue-analyzer), so it's served
          # under /queue-analyzer/, not at the domain root.
          NEXT_PUBLIC_BASE_PATH: /queue-analyzer

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
